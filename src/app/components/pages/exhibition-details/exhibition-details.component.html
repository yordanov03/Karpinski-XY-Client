<app-navbar></app-navbar>

<div class="inner-banner inner-bg1">
    <div class="container">
        <div class="inner-title">
            <h3>Exhibition Details</h3>
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li><i class='bx bxs-chevrons-right'></i></li>
                <li><a routerLink="/exhibitions">Exhibitions</a></li>
                <li><i class='bx bxs-chevrons-right'></i></li>
                <li>Exhibition Details</li>
            </ul>
        </div>
    </div>
</div>

<div class="service-dtls pt-100 pb-70" *ngIf="exhibition$ | async as exhibition">
    <div class="container">
        <div class="row">
            <!-- Main Image and Thumbnails Section -->
            <div class="col-lg-6">
                <div class="main-image-display">
                    <img [src]="apiUrl + selectedImage" class="d-block w-100" alt="Main Exhibition Image">
                </div>
                
                <!-- Thumbnails -->
                <div class="carousel-thumbnails">
                    <img *ngFor="let image of exhibition.exhibitionImages; let i = index" 
                         [src]="apiUrl + image.imagePath" 
                         (click)="selectImage(image.imagePath)" 
                         class="img-thumbnail" 
                         [class.active]="selectedImage === image.imagePath">
                </div>
            </div>

            <!-- Sidebar Information Section -->
            <div class="col-lg-6" style="padding-left: 10%;">
                <div class="service-sidebar">
                    <div class="service-sidebar-widget">
                        <h3>Additional Information</h3>
                        <ul>
                            <li>
                                <i class='bx bxs-calendar'></i>
                                <a>
                                    {{ exhibition.startDate | date:'dd/MM/yyyy' }} - {{ exhibition.endDate | date:'dd/MM/yyyy' }}
                                </a> 
                            </li>
                        </ul>
                    </div>

                    <div class="service-sidebar-widget">
                        <h3>Contacts</h3>
                        <ul>
                            <li>
                                <i class='bx bxs-map'></i>
                                {{exhibition.location}}
                            </li>
                            <li>
                                <i class='bx bxs-brush'></i>
                                <a href="tel:+19876543210">{{exhibition.organizer}}</a>
                            </li>
                            <li>
                                <i class='bx bi bi-link'></i>
                                <a href="{{exhibition.link}}">Link</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full-Width Long Description Section -->
        <div class="row">
            <div class="col-12">
                <div class="service-dtls-title">
                    <h3>{{exhibition.title}}</h3>
                    <div [innerHTML]="getFormattedDescription(exhibition.longDescription)" style="text-align: justify;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<app-footer></app-footer>
