<app-navbar></app-navbar>

<div class="inner-banner inner-bg1">
    <div class="container">
        <div class="inner-title">
            <h3>Exhibition Details</h3>
            <ul>
                <li><a routerLink="/">Home</a></li>
                <li><i class='bx bxs-chevrons-right'></i></li>
                <li><a routerLink="/exhibitions">Exhibitions</a></li>
                <li><i class='bx bxs-chevrons-right'></i></li>
                <li>Exhibition Details</li>
            </ul>
        </div>
    </div>
</div>

<section class="service-dtls pt-100 pb-70" *ngIf="exhibition$ | async as exhibition">
    <div class="container">
        <div class="row">
            <!-- Main Image and Thumbnails Section -->
            <div class="col-lg-6 col-md-12">
                <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner" role="listbox">
                        <div *ngFor="let image of exhibition?.exhibitionImages; let i = index" class="carousel-item"
                            [class.active]="i === 0">
                            <img [src]="apiUrl + image.imagePath" class="d-block w-100" alt="..." (click)="openFullSizeImage(image.imagePath)">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>

                <div *ngIf="showFullSizeImage" class="full-size-image-modal">
                    <button class="prev-button" (click)="navigateFullSizeImage('prev')">❮</button>
                    <img [src]="apiUrl + fullSizeImageUrl" class="img-fluid" alt="Full size image" />
                    <button class="next-button" (click)="navigateFullSizeImage('next')">❯</button>
                    <button class="close-modal" (click)="closeFullSizeImage()">X</button>
                </div>

                <!-- Thumbnails -->
                <div class="carousel-thumbnails">
                    <img *ngFor="let image of exhibition.exhibitionImages; let i = index" [src]="apiUrl + image.imagePath"
                        [class.active]="i == 0" (click)="selectImage(i)" class="img-thumbnail">
                </div>
            </div>

            <!-- Sidebar Information Section -->
            <div class="col-lg-6" style="padding-left: 10%;">
                <div class="service-sidebar">
                    <div class="service-sidebar-widget">
                        <h3>Additional Information</h3>
                        <ul>
                            <li>
                                <i class='bx bxs-calendar'></i>
                                <a>
                                    {{ exhibition.startDate | date:'dd/MM/yyyy' }} - {{ exhibition.endDate | date:'dd/MM/yyyy' }}
                                </a> 
                            </li>
                        </ul>
                    </div>

                    <div class="service-sidebar-widget">
                        <h3>Contacts</h3>
                        <ul>
                            <li>
                                <i class='bx bxs-map'></i>
                                {{exhibition.location}}
                            </li>
                            <li>
                                <i class='bx bxs-brush'></i>
                                <a href="tel:+19876543210">{{exhibition.organizer}}</a>
                            </li>
                            <li>
                                <i class='bx bi bi-link'></i>
                                <a href="{{exhibition.link}}">Link</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Full-Width Long Description Section -->
        <div class="row">
            <div class="col-12">
                <div class="service-dtls-title">
                    <h3>{{exhibition.title}}</h3>
                    <div [innerHTML]="getFormattedDescription(exhibition.longDescription)" style="text-align: justify;"></div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-footer></app-footer>
